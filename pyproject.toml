[project]
name = "blip8"
version = "0.0.1"
description = "NES-style sound and music from code. Four voices, no samples."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "sindriax" }]
dependencies = [
    "numpy>=2.0",
]

# [project.scripts]
# blip8 = "blip8.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
# Ruff reformats Python snippets inside markdown; leave the README alone.
extend-exclude = ["*.md"]
