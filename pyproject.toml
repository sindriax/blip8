[project]
name = "blip8"
version = "0.1.0"
description = "Chiptune sound synthesis from code: the four voices of the NES and Game Boy, no samples."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "sindriax" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "chiptune",
    "8-bit",
    "nes",
    "gameboy",
    "synthesis",
    "audio",
    "sound",
    "wav",
    "retro",
    "gamedev",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "numpy>=2.0",
]

[project.urls]
Homepage = "https://github.com/sindriax/blip8"
Repository = "https://github.com/sindriax/blip8"
Issues = "https://github.com/sindriax/blip8/issues"

# [project.scripts]
# blip8 = "blip8.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [".claude", ".github", ".gitignore"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
# Ruff reformats Python snippets inside markdown; leave the README alone.
extend-exclude = ["*.md"]
